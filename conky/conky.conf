-- Stacked, multi-line system-info panel.
--
-- Shown only while a Super (Mod4) key is held, to mirror i3bar's
-- `mode hide` + `modifier $mod`. The window is mapped/unmapped by
-- conky-mod-toggle.sh; conky itself stays running in the background.

conky.config = {
    -- own_window_type = override -> override-redirect window. i3 never
    -- manages it, so the toggle script can map/unmap it with xdotool
    -- without fighting the window manager.
    own_window = true,
    own_window_type = 'override',
    own_window_class = 'Conky',
    own_window_title = 'conky',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_colour = '000000',

    -- placement: top-right corner
    alignment = 'top_right',
    gap_x = 40,
    gap_y = 50,
    minimum_width = 300,
    border_inner_margin = 18,
    border_outer_margin = 0,

    -- fonts / colours: pure white on black, labels distinguished by
    -- boldface (template uses ${font monospace:bold:size=16}) rather than colour.
    use_xft = true,
    font = 'monospace:size=16',
    override_utf8_locale = true,
    default_color = 'ffffff',

    -- behaviour
    update_interval = 1.0,
    double_buffer = true,
    no_buffers = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    background = false,
}

conky.text = [[
${font monospace:size=34}${time %H:%M}${font}
${time %a  %Y-%m-%d}  ${time %z}

${font monospace:bold:size=16}WLN  ${font}${execi 3 timeout 2 $HOME/.config/conky/conky-wifi.sh}
${font monospace:bold:size=16}ETH  ${font}${execi 5 timeout 2 $HOME/.config/conky/conky-eth.sh}
${font monospace:bold:size=16}BAT  ${font}${execi 5 $HOME/.config/conky/conky-bat.sh pct}${alignr}${execi 5 $HOME/.config/conky/conky-bat.sh time}
${font monospace:bold:size=16}RAM  ${font}${execi 2 $HOME/.config/conky/conky-mem.sh}
${font monospace:bold:size=16}DSK  ${font}${execi 5 $HOME/.config/conky/conky-disk.sh}

${font monospace:bold:size=16}CPU  physical cores${font}
${execi 1 $HOME/.config/conky/conky-cpu.sh}
${font monospace:bold:size=16}TOP  by cpu${font}
${execi 1 $HOME/.config/conky/conky-top.sh}
]]
